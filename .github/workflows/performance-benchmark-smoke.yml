name: Performance benchmark smoke test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  performance_benchmark_smoke:
    name: Performance benchmark smoke test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.5'
          cache: pip
          cache-dependency-path: requirements_ci.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements_ci.txt
      - name: Run performance benchmark 
        run: |
          python -m pytest -v \
             tests/test_performance_benchmark_smoke.py::test_pipeline_performance_cli \
             tests/test_performance_benchmark_smoke.py::test_staged_performance_cli